<h2>Daftar Pengajuan Leasing (Child Component Table)</h2>
<button>
    <a href="/add-creditur">Add Creditur</a>
</button>
<table border="1" [cellPadding]="10" [cellSpacing]="0">
    <thead>
        <tr>
            <th>No</th>
            <th>Nama</th>
            <th>Umur</th>
            <th>Pekerjaan</th>
            <th>Tanggal Pengajuan</th>
            <th>Jatuh Tempo</th>
            <th>Aksi</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let item of childrenData; let i = index">
            <td align="center">{{i+1}}</td>
            <td>{{item.name}}</td>
            <td align="center">{{item.age}}</td>
            <td>{{item.job}}</td>
            <td align="center">{{ item.tanggalPengajuan | date:'dd MMM yyyy' }}</td>
            <td align="center">
                {{ item.dueDate | date:'dd MMMM yyyy' }}
            </td>
            <td align="center" *ngIf="item.id">
                <button (click)="hapusData(item.id)" class="btn-delete" title="Hapus">
                    🗑️
                </button>
                <a [routerLink]="['/detail-creditur', item.id]">
                  <button class="btn-detail" title="Detail">Detail</button>
                </a>
            </td>
        </tr>
    </tbody>  
</table>
